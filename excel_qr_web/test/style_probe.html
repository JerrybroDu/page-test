<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>样式探针</title>
<link rel="stylesheet" href="../css/style.css">
</head>
<body>
<div class="table-wrap" style="max-width:500px;">
  <table class="preview-table">
    <thead><tr><th>行</th><th>内容</th><th>二维码</th></tr></thead>
    <tbody>
      <tr>
        <td class="col-row">2</td>
        <td><span class="cell-elide" title="long">这是一个特别长的内容这是一个特别长的内容这是一个特别长的内容这是一个特别长的内容</span></td>
        <td class="col-qr"></td>
      </tr>
    </tbody>
  </table>
</div>
<span class="badge">网页版</span>
<button type="button" class="btn btn-ghost theme-btn">
  <svg class="theme-icon" viewBox="0 0 24 24" width="19" height="19" aria-hidden="true">
    <path d="M12 3a9 9 0 1 0 0 18h1.5a2 2 0 0 0 0-4H12a2 2 0 0 1 0-4h7a2 2 0 0 0 2-2A9 9 0 0 0 12 3z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="7.4" cy="11" r="1.15" fill="var(--primary)"/>
    <circle cx="12" cy="7.6" r="1.15" fill="var(--primary)"/>
    <circle cx="16.6" cy="11" r="1.15" fill="var(--primary)"/>
  </svg>
</button>
<pre id="result">pending</pre>
<script>
  function check() {
    var lines = [], failed = false;
    function ok(c, m) { lines.push((c ? 'PASS ' : 'FAIL ') + m); if (!c) failed = true; }
    var th = getComputedStyle(document.querySelector('.preview-table th'));
    var td = getComputedStyle(document.querySelector('.preview-table td'));
    ok(th.textAlign === 'center', '表头居中（text-align=' + th.textAlign + '）');
    ok(td.textAlign === 'center', '内容居中（text-align=' + td.textAlign + '）');
    var badge = getComputedStyle(document.querySelector('.badge'));
    ok(/rgba\(255, 255, 255/.test(badge.backgroundColor), 'badge 为白色玻璃底（' + badge.backgroundColor + '）');
    var icon = document.querySelector('.theme-icon');
    ok(!!icon, '主题按钮使用调色板图标（.theme-icon 存在）');
    var probe = document.createElement('i');
    probe.style.color = 'var(--on-primary)';
    document.body.appendChild(probe);
    var resolvedOnPrimary = getComputedStyle(probe).color;
    probe.remove();
    var iconColor = getComputedStyle(icon).color;
    ok(iconColor === resolvedOnPrimary, '图标描边跟随主色文字色（' + iconColor + ' = ' + resolvedOnPrimary + '）');
    var primaryDot = icon.querySelector('circle').getAttribute('fill');
    ok(primaryDot === 'var(--primary)', '图标内色点引用 --primary，主题切换时自动变色');
    var span = document.querySelector('.cell-elide');
    ok(span.scrollWidth > span.clientWidth && getComputedStyle(span).textOverflow === 'ellipsis',
      '居中后超长内容仍以 … 截断');
    var res = 'TITLE=' + (failed ? 'FAIL' : 'PASS') + '\n' + lines.join('\n');
    document.getElementById('result').textContent = res;
    document.title = failed ? 'FAIL' : 'PASS';
  }
  window.addEventListener('load', function () { setTimeout(check, 300); });
  setTimeout(check, 2500);
</script>
</body>
</html>
