<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>主题切换测试</title>
</head>
<body>
<pre id="result">pending</pre>
<iframe id="app" src="../index.html" style="display:none"></iframe>
<script>
  var lines = [];
  var failed = false;
  function ok(c, m) { lines.push((c ? 'PASS ' : 'FAIL ') + m); if (!c) failed = true; }
  function finish() {
    document.title = failed ? 'FAIL' : 'PASS';
    document.getElementById('result').textContent = 'TITLE=' + (failed ? 'FAIL' : 'PASS') + '\n' + lines.join('\n');
  }
  var frame = document.getElementById('app');
  var started = false;
  function start() {
    if (started) return; started = true;
    setTimeout(runTests, 400);
  }
  frame.addEventListener('load', start);
  setTimeout(start, 6000); // 兜底

  function runTests() {
    var win = frame.contentWindow;
    var doc = win.document;
    var html = doc.documentElement;
    try {
      ok(html.getAttribute('data-theme') === 'green', '默认主题为 green');
      var btn = doc.getElementById('btnTheme');
      ok(!!btn, 'header 中有主题按钮');
      var panel = doc.getElementById('themePanel');
      ok(!!panel, '有主题面板');

      btn.click();
      ok(!panel.classList.contains('hidden'), '点击按钮后面板展开');

      var purple = panel.querySelector('.theme-item[data-theme="purple"]');
      ok(!!purple, '面板包含「科技紫」选项');
      purple.click();
      ok(html.getAttribute('data-theme') === 'purple', '点击后 data-theme=purple');
      ok(panel.classList.contains('hidden'), '选择后面板自动收起');
      var primary = win.getComputedStyle(html).getPropertyValue('--primary').trim();
      ok(/a26ff7|b18efb/.test(primary), 'CSS 主色已切换为紫系（--primary=' + primary + '）');
      try {
        ok(win.localStorage.getItem('qr_theme') === 'purple', '选择已写入 localStorage');
      } catch (e2) { lines.push('SKIP localStorage 不可用：' + e2.message); }

      btn.click(); // 再打开
      ok(purple.classList.contains('active'), '「科技紫」显示选中态');
      doc.body.click(); // 点击面板外
      ok(panel.classList.contains('hidden'), '点击外部后面板关闭');

      // 依次切换其余主题，验证 data-theme 与主色联动
      var map = { blue: /33a5e8|4db9f0/, orange: /f59b18|ffae52/, teal: /17b8a6|2dd4bf/, green: /07c160|2cd97a/ };
      for (var key in map) {
        panel.querySelector('.theme-item[data-theme="' + key + '"]').click();
        ok(html.getAttribute('data-theme') === key, '切到 ' + key);
        var c = win.getComputedStyle(html).getPropertyValue('--primary').trim();
        ok(map[key].test(c), key + ' 主色正确（--primary=' + c + '）');
        btn.click();
      }
    } catch (e) { lines.push('FATAL ' + (e && e.message ? e.message : e)); failed = true; }
    finish();
  }
</script>
</body>
</html>
